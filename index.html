            const resultBox = document.getElementById("result-box");

            // 複製一份牌組以進行不重複抽牌
            let tempDeck = [...tarotDeck];
            
            for (let i = 0; i < count; i++) {
                const randomIndex = Math.floor(Math.random() * tempDeck.length);
                const selectedCard = tempDeck.splice(randomIndex, 1)[0];
                const isUpright = Math.random() >= 0.5;

                const cardElement = document.createElement("div");
                cardElement.className = "card-container";
                cardElement.innerHTML = `
                    <div class="card-title">${i + 1}. ${selectedCard.name}</div>
                    <div class="card-position">${isUpright ? "【正位】" : "【逆位】"}</div>
                    <div class="card-meaning">${isUpright ? selectedCard.upright : selectedCard.reversed}</div>
                `;
                resultBox.appendChild(cardElement);
            }
        }
    </script>

</body>
</html>
